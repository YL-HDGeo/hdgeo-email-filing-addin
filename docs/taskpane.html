<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HD Geo filing</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <div class="layout">
    <!-- Preview only (normal browser): a mock Outlook window around the panel.
         Inside real Outlook none of this shows, only the panel. -->
    <div id="ribbon" class="ribbon" hidden>
      <span class="preview-tag">Preview: sample data, mock Outlook window</span>
      <span class="rb">Reply</span><span class="rb">Reply all</span><span class="rb">Forward</span>
      <span class="rb-sep"></span>
      <button type="button" id="ribbon-file" class="rb rb-addin" aria-pressed="true">
        <img src="assets/icon-32.png" alt="" width="16" height="16" /> File to project
      </button>
    </div>
    <aside id="mail-list" class="mail-list" hidden aria-label="Inbox"></aside>
    <section id="reading" class="reading" hidden>
      <article class="email" id="sample-email"></article>
    </section>

    <main class="pane" id="pane">
      <div id="host-head" class="host-head" hidden>
        <span>HD Geo filing</span>
        <button type="button" id="host-close" aria-label="Close">×</button>
      </div>

      <header class="brand">
        <span class="brand-tri" aria-hidden="true"></span>
        <div class="brand-text">
          <span class="brand-title">Email filing</span>
          <span class="brand-sub">HD Geo project sites</span>
        </div>
        <button type="button" id="open-settings" class="icon-btn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11.3 1.5l.4 2.1c.5.2 1 .5 1.4.8l2-.8 1.3 2.3-1.6 1.4c.1.5.1 1 0 1.5l1.6 1.4-1.3 2.3-2-.8c-.4.3-.9.6-1.4.8l-.4 2.1H8.7l-.4-2.1c-.5-.2-1-.5-1.4-.8l-2 .8-1.3-2.3 1.6-1.4a4.6 4.6 0 010-1.5L3.6 5.9l1.3-2.3 2 .8c.4-.3.9-.6 1.4-.8l.4-2.1h2.6zM10 7a3 3 0 100 6 3 3 0 000-6z"/></svg>
        </button>
      </header>

      <section id="view-main">
        <div id="file-card" class="card" aria-live="polite"></div>

        <div class="card ask">
          <label class="card-title" for="ask-input">Ask about filed emails</label>
          <form id="ask-form" class="ask-row" autocomplete="off">
            <input id="ask-input" type="search" placeholder="e.g. tom waikato bilders retaning wall last month" />
            <button type="submit" class="btn-ask">Ask</button>
          </form>
          <div id="ask-chips" class="chips"></div>
          <p id="ask-status" class="help"></p>
          <ul id="ask-results" class="results-list"></ul>
        </div>
      </section>

      <section id="view-settings" hidden>
        <button type="button" id="close-settings" class="link-btn">‹ Back</button>
        <div class="card">
          <p class="card-title">Settings</p>
          <label class="label" for="flow-url">Filing flow link</label>
          <input id="flow-url" type="password" placeholder="HTTP URL of 'Email filing - File email'" autocomplete="off" />
          <label class="label" for="search-url">Search flow link</label>
          <input id="search-url" type="password" placeholder="HTTP URL of 'Email filing - Search'" autocomplete="off" />
          <label class="check"><input type="checkbox" id="auto-file" checked /> File automatically when the subject has one HD number</label>
          <button id="save-settings" class="btn-primary" type="button">Save</button>
          <p id="settings-help" class="help">Saved in your own Outlook settings only. Treat these links like passwords: anyone who has them can file or search project emails.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="matching.js"></script>
  <script src="sample-data.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
